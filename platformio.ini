; Wykrywacz Remote ID na płytce ESP32-2432S028 ("Cheap Yellow Display", ekran dotykowy 2,8")
; Wgranie: pio run -e cyd -t upload        (płytka z jednym micro-USB, ekran ILI9341)
;          pio run -e cyd2usb -t upload    (płytka z micro-USB i USB-C, ekran ST7789)

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 921600
board_build.partitions = huge_app.csv
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3
    bodmer/TFT_eSPI@2.5.43
build_flags =
    -D USER_SETUP_LOADED=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D USE_HSPI_PORT=1
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SMOOTH_FONT=0

[env:cyd]
build_flags =
    ${env.build_flags}
    -D ILI9341_2_DRIVER=1

[env:cyd2usb]
build_flags =
    ${env.build_flags}
    -D ST7789_DRIVER=1
    -D TFT_RGB_ORDER=TFT_BGR
